name: Update Dist

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-dist:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
      - uses: MH4GF/shared-config/.github/composite-actions/setup-pnpm@5378bfce550384e1e9a83504ab2a71df28cc6920 # main
      - run: pnpm package
      - name: Commit and Push if there are changes
        env:
          MH4GF_PAT: ${{ secrets.MH4GF_PAT }}
        run: |
          git add .
          if git diff --staged --quiet; then
            echo "dist is up to date"
            exit 0
          fi
          git remote set-url origin https://x-access-token:${MH4GF_PAT}@github.com/${GITHUB_REPOSITORY}
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m 'update dist'
          git push
